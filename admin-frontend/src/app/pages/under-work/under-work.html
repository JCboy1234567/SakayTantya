<div class="min-h-[calc(100vh-5rem)] bg-base-200/50 p-4 sm:p-6 lg:p-8">
  <div class="mx-auto max-w-5xl">

    <!-- Main Card -->
    <div class="overflow-hidden rounded-3xl border border-base-300 bg-base-100 shadow-sm">

      

      <!-- Content -->
      <div class="px-6 py-12 sm:px-12 sm:py-16">
        <div class="mx-auto flex max-w-xl flex-col items-center text-center">

          <!-- Icon -->
          <div class="mb-6 flex h-24 w-24 items-center justify-center rounded-full bg-primary/10">
            <svg
              lucideConstruction
              class="h-12 w-12 text-primary"
            ></svg>
          </div>

          <div class="badge badge-warning badge-outline mb-4 gap-2 px-4 py-3">
            <span class="h-2 w-2 animate-pulse rounded-full bg-warning"></span>

          </div>

          <h2 class="mb-4 text-2xl font-bold tracking-tight sm:text-3xl">

          </h2>

          <p class="mb-8 leading-7 text-base-content/60">

          </p>

            <div class="mb-3 flex items-center justify-between gap-3">
              <span class="text-sm font-semibold">Development status</span>
              <span class="badge badge-info badge-sm">In Progress</span>
            </div>

            <progress
              class="progress progress-primary w-full"
              value="45"
              max="100"
            ></progress>

            <p class="mt-2 text-xs text-base-content/50">
              This feature is currently being prepared.
            </p>
          </div>

          <p class="mt-8 text-sm text-base-content/50">

          </p>

        </div>
