<div class="min-h-screen bg-base-200 flex items-center justify-center p-4">
  <div class="card w-full max-w-md bg-base-100 shadow-xl border border-base-300">
    <div class="card-body p-8 space-y-6">

      <!-- Header Icon & Title -->
      <div class="text-center space-y-2">
        <div class="w-16 h-16 bg-green-900/10 text-green-900 rounded-2xl flex items-center justify-center mx-auto border border-green-900/20 shadow-sm">
          <svg lucideBus class="w-8 h-8 text-green-800"></svg>
        </div>
        <h1 class="text-2xl font-extrabold tracking-tight text-base-content">SakayTantya Commuter</h1>
        <p class="text-xs text-base-content/60">Sign in with your email and password to access your account.</p>
      </div>

      <!-- Success / Error Alerts -->
      @if (successMessage) {
        <div class="alert alert-success text-xs py-3 shadow-sm">
          <span>{{ successMessage }}</span>
        </div>
      }
      @if (errorMessage) {
        <div class="alert alert-error text-xs py-3 shadow-sm text-white">
          <span>{{ errorMessage }}</span>
        </div>
      }

      <!-- Login Form -->
      <form (ngSubmit)="onLogin()" class="space-y-4">
        <div class="form-control">
          <label class="label">
            <span class="label-text text-xs uppercase font-semibold text-base-content/70">Email Address</span>
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-base-content/40">
              <svg lucideMail class="w-4 h-4"></svg>
            </span>
            <input
              type="email"
              [(ngModel)]="email"
              name="email"
              placeholder="e.g. commuter@example.com"
              class="input input-bordered w-full pl-10 text-xs bg-base-200/50"
              required
            />
          </div>
        </div>

        <div class="form-control">
          <label class="label">
            <span class="label-text text-xs uppercase font-semibold text-base-content/70">Password</span>
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-base-content/40">
              <svg lucideLock class="w-4 h-4"></svg>
            </span>
            <input
              type="password"
              [(ngModel)]="password"
              name="password"
              placeholder="••••••••"
              class="input input-bordered w-full pl-10 text-xs bg-base-200/50"
              required
            />
          </div>
        </div>

        <div class="pt-2">
          <button
            type="submit"
            class="btn btn-sm bg-green-900 text-white text-xs hover:bg-green-950 w-full h-11 gap-2 shadow-md border-0"
            [disabled]="isLoading"
          >
            <svg lucideLoader class="w-4 h-4 animate-spin" *ngIf="isLoading"></svg>
            <span>Sign In</span>
            <svg lucideArrowRight class="w-4 h-4" *ngIf="!isLoading"></svg>
          </button>
        </div>
      </form>

      <!-- Footer / Register Link -->
      <div class="text-center pt-4 border-t border-base-200 text-xs text-base-content/70">
        Don't have an account yet?
        <a routerLink="/create-account" class="font-semibold text-green-900 hover:underline ml-1">Create Account</a>
      </div>

    </div>
  </div>
</div>
