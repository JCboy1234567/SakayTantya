<footer
  [ngClass]="isDarkMode
    ? 'border-gray-500/60 bg-gray-900/85 shadow-[0_12px_40px_rgba(0,0,0,0.5)] ring-white/10'
    : 'border-green-900/20 bg-white/85 shadow-[0_12px_40px_rgba(15,23,42,0.22)] ring-green-900/10'"
  class="pointer-events-auto fixed bottom-3 left-1/2 z-30 w-[calc(100%-1.5rem)] max-w-md -translate-x-1/2 rounded-3xl border px-2 py-2 ring-1 backdrop-blur-2xl backdrop-saturate-150 sm:bottom-5"
>
    <div class="mx-auto flex w-full items-center justify-around gap-1">
      <!-- Plan / Trip - Main Feature -->
      <a
        routerLink="/main-dashboard/plan"
        routerLinkActive="route-active"
        [routerLinkActiveOptions]="{ exact: true }"
        [ngClass]="planLink.isActive ? (isDarkMode ? 'text-green-300 bg-green-500/10 border-green-500/30 shadow-[0_0_15px_rgba(34,197,94,0.12)]' : 'text-green-900 bg-green-50 border-green-200 shadow-sm') : (isDarkMode ? 'text-gray-400 hover:text-gray-100 hover:bg-gray-800/60' : 'text-gray-500 hover:text-green-900 hover:bg-green-50')"
        class="relative flex flex-col items-center gap-1 rounded-2xl border border-transparent px-3 py-2 text-[10px] font-semibold uppercase tracking-wider transition-all duration-300 ease-out cursor-pointer group sm:px-4"
        #planLink="routerLinkActive"
      >
        <div [ngClass]="planLink.isActive ? (isDarkMode ? 'bg-gradient-to-br from-green-400 to-emerald-500 shadow-lg shadow-green-500/30 text-gray-950' : 'bg-green-100 text-green-800') : (isDarkMode ? 'bg-gray-800/80 group-hover:bg-gray-700/80' : 'bg-gray-100 group-hover:bg-green-100')" class="rounded-xl p-2 transition-all duration-300">
          <svg lucideMap class="w-5 h-5 pointer-events-none"></svg>
        </div>
        <span class="transition-all duration-300">Plan</span>
        <div *ngIf="!planLink.isActive" class="absolute -top-1 -right-1 w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
      </a>

      <!-- Fuels -->
      <a
        routerLink="/main-dashboard/fuels"
        routerLinkActive="route-active"
        [routerLinkActiveOptions]="{ exact: true }"
        [ngClass]="fuelsLink.isActive ? (isDarkMode ? 'text-green-300 bg-green-500/10 border-green-500/30' : 'text-green-900 bg-green-50 border-green-200') : (isDarkMode ? 'text-gray-400 hover:text-gray-100 hover:bg-gray-800/60' : 'text-gray-500 hover:text-green-900 hover:bg-green-50')"
        class="flex flex-col items-center gap-1 rounded-2xl border border-transparent px-3 py-2 text-[10px] font-semibold uppercase tracking-wider transition-all duration-300 ease-out cursor-pointer group"
        #fuelsLink="routerLinkActive"
      >
        <div [ngClass]="fuelsLink.isActive ? (isDarkMode ? 'bg-green-500/20 text-green-300' : 'bg-green-100 text-green-800') : (isDarkMode ? 'bg-gray-800/60 group-hover:bg-gray-700/60' : 'bg-gray-100 group-hover:bg-green-100')" class="rounded-lg p-1.5 transition-all duration-300">
          <svg lucideFuel class="w-5 h-5 pointer-events-none"></svg>
        </div>
        <span>Fuels</span>
      </a>

      <!-- Guide -->
      <a
        routerLink="/main-dashboard/guide"
        routerLinkActive="route-active"
        [routerLinkActiveOptions]="{ exact: true }"
        [ngClass]="guideLink.isActive ? (isDarkMode ? 'text-green-300 bg-green-500/10 border-green-500/30' : 'text-green-900 bg-green-50 border-green-200') : (isDarkMode ? 'text-gray-400 hover:text-gray-100 hover:bg-gray-800/60' : 'text-gray-500 hover:text-green-900 hover:bg-green-50')"
        class="flex flex-col items-center gap-1 rounded-2xl border border-transparent px-3 py-2 text-[10px] font-semibold uppercase tracking-wider transition-all duration-300 ease-out cursor-pointer group"
        #guideLink="routerLinkActive"
      >
        <div [ngClass]="guideLink.isActive ? (isDarkMode ? 'bg-green-500/20 text-green-300' : 'bg-green-100 text-green-800') : (isDarkMode ? 'bg-gray-800/60 group-hover:bg-gray-700/60' : 'bg-gray-100 group-hover:bg-green-100')" class="rounded-lg p-1.5 transition-all duration-300">
          <svg lucideBookOpen class="w-5 h-5 pointer-events-none"></svg>
        </div>
        <span>Guide</span>
      </a>

      <!-- Profile -->
      <a
        routerLink="/main-dashboard/profile"
        routerLinkActive="route-active"
        [routerLinkActiveOptions]="{ exact: true }"
        [ngClass]="profileLink.isActive ? (isDarkMode ? 'text-green-300 bg-green-500/10 border-green-500/30' : 'text-green-900 bg-green-50 border-green-200') : (isDarkMode ? 'text-gray-400 hover:text-gray-100 hover:bg-gray-800/60' : 'text-gray-500 hover:text-green-900 hover:bg-green-50')"
        class="flex flex-col items-center gap-1 rounded-2xl border border-transparent px-3 py-2 text-[10px] font-semibold uppercase tracking-wider transition-all duration-300 ease-out cursor-pointer group"
        #profileLink="routerLinkActive"
      >
        <div [ngClass]="profileLink.isActive ? (isDarkMode ? 'bg-green-500/20 text-green-300' : 'bg-green-100 text-green-800') : (isDarkMode ? 'bg-gray-800/60 group-hover:bg-gray-700/60' : 'bg-gray-100 group-hover:bg-green-100')" class="rounded-lg p-1.5 transition-all duration-300">
          <svg lucideUser class="w-5 h-5 pointer-events-none"></svg>
        </div>
        <span>Profile</span>
      </a>
    </div>
  </footer>
