<header class="sticky top-0 z-40 w-full bg-gray-900 border-b border-gray-800 shadow-md">
  <div class="mx-auto flex max-w-md items-center justify-between px-4 py-3">

    <!-- Logo / Branding -->
    <a
      routerLink="/main-dashboard/plan"
      class="flex items-center gap-2.5 no-underline"
      aria-label="SakayTantya Home"
    >
      <!-- Logo Icon -->
      <div class="relative flex h-9 w-9 items-center justify-center bg-green-950 border border-green-800 text-green-400 rounded-xl shadow-inner">
        <img src="/icons/sakaytantiya-icon.svg" alt="">

        <span
          class="absolute -bottom-1 -right-1 flex h-4 w-4 items-center justify-center rounded-full border border-gray-900 bg-green-500 text-[9px] font-bold text-white"
        >
          ₱
        </span>
      </div>

      <!-- Brand Name -->
      <span class="text-base font-bold tracking-tight text-white">
        Sakay<span class="text-green-400">Tantya</span>
      </span>
    </a>

    <!-- Right Icons (Guide & Logout) -->
    <div class="flex items-center space-x-2">
      <!-- Guide / Help Button -->
      <a
        routerLink="/main-dashboard/guide"
        class="w-9 h-9 bg-gray-800 hover:bg-gray-700 text-gray-200 rounded-xl flex items-center justify-center transition border border-gray-700 shadow-sm"
        aria-label="Help and guide"
        title="Help and Guide"
      >
        <svg lucideBookOpen class="h-4 w-4 text-green-400"></svg>
      </a>

      <!-- Logout Button -->
      <button
        (click)="openLogoutModal($event)"
        class="w-9 h-9 bg-red-950/80 hover:bg-red-900 text-red-300 rounded-xl flex items-center justify-center transition border border-red-800/80 shadow-sm cursor-pointer"
        aria-label="Sign Out"
        title="Sign Out"
      >
        <svg lucideLogOut class="h-4 w-4 text-red-400"></svg>
      </button>
    </div>

  </div>
</header>

<!-- LOGOUT CONFIRMATION MODAL -->
@if (showLogoutModal) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm animate-fade-in p-4">
    <div class="w-full max-w-sm bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl p-6 text-center space-y-5">
      <div class="w-16 h-16 bg-red-950 text-red-400 rounded-full flex items-center justify-center mx-auto border border-red-800 shadow-inner">
        <svg lucideLogOut class="w-10 h-10 text-red-400 animate-pulse"></svg>
      </div>
      <div class="space-y-1">
        <h3 class="text-lg font-bold text-white">Confirm Sign Out</h3>
        <p class="text-xs text-gray-400">Are you sure you want to log out from your commuter account?</p>
      </div>
      <div class="flex space-x-3 pt-2">
        <button
          type="button"
          (click)="cancelLogout()"
          class="flex-1 py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-200 font-semibold text-xs rounded-xl transition border border-gray-700 cursor-pointer"
        >
          Cancel
        </button>
        <button
          type="button"
          (click)="confirmLogout()"
          class="flex-1 py-2.5 bg-red-700 hover:bg-red-600 text-white font-semibold text-xs rounded-xl shadow-lg transition cursor-pointer flex items-center justify-center space-x-1.5"
        >
          <svg lucideLogOut class="w-4 h-4"></svg>
          <span>Sign Out</span>
        </button>
      </div>
    </div>
  </div>
}
