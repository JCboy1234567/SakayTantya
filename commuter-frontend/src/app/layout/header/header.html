<header class="sticky top-0 z-40 w-full bg-linear-to-b from-gray-900 via-gray-900/98 to-gray-900/95 border-b border-gray-800/50 shadow-[0_4px_20px_rgba(0,0,0,0.3)] backdrop-blur-xl">
  <div class="mx-auto flex max-w-md items-center justify-between px-4 py-3">

    <!-- Logo / Branding -->
    <a
      routerLink="/main-dashboard/plan"
      class="flex items-center gap-2.5 no-underline group"
      aria-label="SakayTantya Home"
    >
      <!-- Logo Icon -->
      <div class="relative flex h-10 w-10 items-center justify-center bg-linear-to-br from-green-950 to-emerald-950 border border-green-700/50 text-green-400 rounded-xl shadow-lg shadow-green-900/30 group-hover:shadow-green-500/20 transition-all duration-300">
        <img src="/icons/sakaytantiya-icon.svg" alt="" class="w-6 h-6">

        <span
          class="absolute -bottom-1 -right-1 flex h-4 w-4 items-center justify-center rounded-full border-2 border-gray-900 bg-linear-to-br from-green-400 to-emerald-500 text-[9px] font-bold text-white shadow-lg shadow-green-500/30"
        >
          ₱
        </span>
      </div>

      <!-- Brand Name -->
      <span class="text-base font-bold tracking-tight text-white">
        Sakay<span class="text-transparent bg-clip-text bg-linear-to-r from-green-400 to-emerald-400">Tantiya</span>
      </span>
    </a>

    <!-- Right Icons (Guide & Logout) -->
    <div class="flex items-center gap-2">
      <!-- Guide / Help Button -->
      <a
        routerLink="/main-dashboard/guide"
        routerLinkActive="bg-green-500/20 border-green-500/30"
        class="w-10 h-10 bg-gray-800/60 hover:bg-gray-700/80 text-gray-200 rounded-xl flex items-center justify-center transition-all duration-300 border border-gray-700/50 shadow-sm hover:shadow-md hover:scale-105 group"
        aria-label="Help and guide"
        title="Help and Guide"
      >
        <svg lucideBookOpen class="h-4 w-4 text-green-400 group-hover:scale-110 transition-transform duration-300"></svg>
      </a>

      <!-- Logout Button -->
      <button
        (click)="openLogoutModal($event)"
        class="w-10 h-10 bg-red-950/60 hover:bg-red-900/80 text-red-300 rounded-xl flex items-center justify-center transition-all duration-300 border border-red-800/50 shadow-sm hover:shadow-md hover:scale-105 cursor-pointer group"
        aria-label="Sign Out"
        title="Sign Out"
      >
        <svg lucideLogOut class="h-4 w-4 text-red-400 group-hover:scale-110 transition-transform duration-300"></svg>
      </button>
    </div>

  </div>
</header>

<!-- LOGOUT CONFIRMATION MODAL -->
@if (showLogoutModal) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md animate-fade-in p-4">
    <div class="w-full max-w-sm bg-linear-to-br from-gray-900 to-gray-950 border border-gray-800/50 rounded-2xl shadow-2xl p-6 text-center space-y-5 transform transition-all duration-300">
      <div class="w-16 h-16 bg-linear-to-br from-red-950 to-red-900 text-red-400 rounded-full flex items-center justify-center mx-auto border border-red-800/50 shadow-lg shadow-red-900/30">
        <svg lucideLogOut class="w-8 h-8 text-red-400"></svg>
      </div>
      <div class="space-y-2">
        <h3 class="text-xl font-bold text-white">Confirm Sign Out</h3>
        <p class="text-sm text-gray-400">Are you sure you want to log out from your commuter account?</p>
      </div>
      <div class="flex gap-3 pt-2">
        <button
          type="button"
          (click)="cancelLogout()"
          class="flex-1 py-3 bg-gray-800/60 hover:bg-gray-700/80 text-gray-200 font-semibold text-sm rounded-xl transition-all duration-300 border border-gray-700/50 cursor-pointer hover:scale-[1.02]"
        >
          Cancel
        </button>
        <button
          type="button"
          (click)="confirmLogout()"
          class="flex-1 py-3 bg-linear-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-semibold text-sm rounded-xl shadow-lg shadow-red-900/30 transition-all duration-300 cursor-pointer flex items-center justify-center gap-2 hover:scale-[1.02]"
        >
          @if (isLoggingOut) {
            <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Signing Out...</span>
          } @else {
            <svg lucideLogOut class="w-4 h-4"></svg>
            <span>Sign Out</span>
          }
        </button>
      </div>
    </div>
  </div>
}
