  <!-- Top Navigation Header -->
   <header class="sticky top-0 z-40">
    <app-header></app-header>
   </header>

  <!-- Router Outlet for Child Pages (Plan, Fuels, Guide, Profile) -->

    <router-outlet></router-outlet>
  </main>

  <app-sidebar></app-sidebar>
</div>
