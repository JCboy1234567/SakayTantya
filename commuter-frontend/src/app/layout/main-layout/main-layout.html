<div class="min-h-screen bg-gray-950 text-gray-100 flex flex-col justify-between">
  <!-- Top Navigation Header -->
  <header class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex items-center justify-between shadow-md sticky top-0 z-50">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 bg-green-950 border border-green-800 text-green-400 rounded-xl flex items-center justify-center font-bold shadow-inner">
        <svg lucideBus class="w-5 h-5 text-green-400"></svg>
      </div>
      <div>
        <h1 class="text-sm md:text-base font-bold text-white tracking-wide">SakayTantya Commuter</h1>
        <p class="text-[10px] md:text-xs text-gray-400">Mobile Commuter Portal</p>
      </div>
    </div>
    <div class="flex items-center space-x-3">
      <a routerLink="/login-user" class="px-3.5 py-2 bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs font-semibold rounded-xl transition border border-gray-700 flex items-center space-x-2">
        <svg lucideLogOut class="w-4 h-4 text-gray-400"></svg>
        <span>Sign Out</span>
      </a>
    </div>
  </header>

  <!-- Router Outlet for Child Pages (Plan, Fuels, Guide) -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 pb-24">
    <router-outlet></router-outlet>
  </main>

  <!-- Responsive Footer / Bottom Navigation Bar -->
  <footer class="bg-gray-900 border-t border-gray-800 px-6 py-3 fixed bottom-0 inset-x-0 z-50 shadow-2xl backdrop-blur-md bg-opacity-95">
    <div class="max-w-md mx-auto flex items-center justify-around">
      <!-- Plan / Trip -->
      <a
        routerLink="/main-dashboard/plan"
        routerLinkActive="text-green-400 bg-green-950/60 border-green-800/60"
        class="flex flex-col items-center space-y-1 px-4 py-2 rounded-xl text-gray-400 hover:text-white transition border border-transparent text-[10px] font-semibold uppercase tracking-wider"
      >
        <svg lucideMap class="w-5 h-5"></svg>
        <span>Plan</span>
      </a>

      <!-- Fuels -->
      <a
        routerLink="/main-dashboard/fuels"
        routerLinkActive="text-green-400 bg-green-950/60 border-green-800/60"
        class="flex flex-col items-center space-y-1 px-4 py-2 rounded-xl text-gray-400 hover:text-white transition border border-transparent text-[10px] font-semibold uppercase tracking-wider"
      >
        <svg lucideFuel class="w-5 h-5"></svg>
        <span>Fuels</span>
      </a>

      <!-- Guide -->
      <a
        routerLink="/main-dashboard/guide"
        routerLinkActive="text-green-400 bg-green-950/60 border-green-800/60"
        class="flex flex-col items-center space-y-1 px-4 py-2 rounded-xl text-gray-400 hover:text-white transition border border-transparent text-[10px] font-semibold uppercase tracking-wider"
      >
        <svg lucideBookOpen class="w-5 h-5"></svg>
        <span>Guide</span>
      </a>
    </div>
  </footer>
</div>
